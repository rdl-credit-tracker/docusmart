<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3C8C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DocuSmart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E9F9A;--blue:#0B3C8C;--bg:#F3F6F8;--card:#fff;--text:#12233B;--mute:#64748B;--line:#E2E8F0;--chip:#E6F4F3;
--font:'Inter','Hind Siliguri',system-ui,sans-serif;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0A1220;--card:#121C2F;--text:#E8EEF7;--mute:#93A3BA;--line:#1F2D45;--chip:#12303A}
html[lang=bn]{--font:'Hind Siliguri','Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100%;overflow-y:auto;padding:0 16px calc(96px + var(--bot))}
.screen{display:none;padding-top:calc(var(--top) + 14px)}
.screen.active{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen.active{animation:none}}
h2{font-size:15px;font-weight:600;margin:22px 0 10px}
.title{font-size:26px;font-weight:700;margin-bottom:14px}
.hero{margin:calc(-1*(var(--top) + 14px)) -16px 0;padding:calc(var(--top) + 18px) 16px 22px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-radius:0 0 32px 32px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:22px}
.brand h1{font-size:20px;line-height:1.1}.brand p{font-size:13px;opacity:.85}
.scan-cta{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:#fff;color:var(--blue);padding:14px 16px;border-radius:22px}
.scan-cta .ico{font-size:26px}.scan-cta b{display:block;font-size:16px}.scan-cta small{color:var(--mute);font-size:13px}
.stats{display:flex;gap:10px;margin-top:16px}
.stats div{flex:1;background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--line)}
.stats b{display:block;font-size:22px;color:var(--teal)}.stats span{font-size:12px;color:var(--mute)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center}
.qa i{font-style:normal;width:54px;height:54px;border-radius:18px;background:var(--chip);display:grid;place-items:center;font-size:24px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;color:var(--mute)}
.empty button{margin-top:10px;color:var(--teal);font-weight:600}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.item .th{width:44px;height:56px;border-radius:8px;background:var(--chip);display:grid;place-items:center}
.item small{color:var(--mute)}
.storage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal))}
.storage p{font-size:13px;color:var(--mute);margin-top:8px}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:13px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.viewfinder{height:46vh;border-radius:26px;background:#0A1220;display:grid;place-items:center;position:relative;color:#9FB3CC;padding:24px;text-align:center}
.frame{position:absolute;inset:22px;border:2px dashed var(--teal);border-radius:14px;opacity:.7}
.modes{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.primary{width:100%;padding:15px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-weight:600;font-size:16px}
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;gap:10px;align-items:center}
.tool i{font-style:normal;font-size:22px;width:42px;height:42px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.tool span{font-size:13px;font-weight:500;line-height:1.25}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:12px;font-size:14px}
.seg button.on{background:var(--teal);color:#fff;font-weight:600}
.rows{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rows button{display:block;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
.rows button:last-child{border:0}
.ver{text-align:center;color:var(--mute);font-size:12px;margin-top:20px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--bot));border-radius:24px 24px 0 0}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 0}
#nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
#nav button.on{color:var(--teal);font-weight:600}#nav button.on i{filter:none;opacity:1}
#nav .fab{flex:none;width:62px;height:62px;border-radius:22px;margin:-26px 6px 0;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 8px 20px rgba(11,60,140,.35);justify-content:center}
#nav .fab i{filter:none;opacity:1;font-size:26px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(100px + var(--bot));background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;font-size:14px}
#toast.show{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* Phase 2: camera overlay */
#cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff}
#cam[hidden],#cam .cv[hidden]{display:none}
#cam .cv{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--top)}
#cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#cam .ov{position:absolute;left:0;top:var(--top);width:100%;height:calc(100% - var(--top) - 110px - var(--bot));pointer-events:none}
#cam .hint{position:absolute;top:calc(var(--top) + 10px);left:0;right:0;text-align:center;font-size:14px;z-index:2;text-shadow:0 1px 4px #000;padding:0 16px}
#cam .stage{flex:1;min-height:0;display:grid;place-items:center;padding:44px 12px 6px}
#cam .stage canvas{touch-action:none;max-width:100%}
#cam .cbar{display:flex;align-items:center;justify-content:space-around;gap:6px;height:110px;padding:0 10px calc(var(--bot) + 6px);background:#000}
#cam .cbar button{min-width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.14);padding:0 14px;font-size:14px;color:#fff}
#cam .cbar .shot{width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid var(--teal)}
#cam .cbar .pri{background:var(--teal);font-weight:600}
#cam .fchips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px}
#cam .fchips .chip{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#cam .fchips .chip.on{background:var(--teal)}
/* Phase 3: PDF Studio */
#ps{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top)}
#ps[hidden]{display:none}
.psh{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:18px;border-bottom:1px solid var(--line)}
.psh button{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.psb{flex:1;overflow-y:auto;padding:0 16px 24px}
.psf{padding:10px 16px calc(10px + var(--bot));border-top:1px solid var(--line);background:var(--card)}
.psf .primary:disabled{opacity:.6}
.lbl{font-size:13px;color:var(--mute);margin:10px 0 6px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0}
.chk input{width:20px;height:20px;accent-color:var(--teal);flex:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.pc .im{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:var(--chip)}
.pc img{max-width:100%;max-height:100%;transition:transform .2s}
.pc .pk{position:absolute;top:10px;left:10px;width:20px;height:20px;accent-color:var(--teal)}
.pc .pa{display:flex;justify-content:space-between;margin-top:4px}
.pc .pa button{flex:1;padding:6px 0;font-size:13px}
.pc small{color:var(--mute)}
#psPad{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:2}
#psPad[hidden]{display:none}
.padbox{background:var(--card);padding:14px;border-radius:20px;width:min(92vw,360px)}
.padbox canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none}
.padbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
/* Phase 3.5: file manager */
.item{cursor:pointer}
.item .th{overflow:hidden;flex:none}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .mt{flex:1;min-width:0}
.item .mt b,.item .mt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:12px;font-size:20px;flex:none}
#vw{position:fixed;inset:0;z-index:48;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top)}
#vw[hidden]{display:none}
#vw .vt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.vp{display:block;width:100%;margin:10px 0;border-radius:8px;border:1px solid var(--line)}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
#sheet .sb{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:14px 16px calc(14px + var(--bot))}
#sheet .sb button{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
#sheet .sb button:last-child{border:0}
#sheet .dg{color:#D93025}
/* scan page */
button.viewfinder{width:100%;height:44vh;max-height:420px;background:linear-gradient(160deg,#0B3C8C,#0E9F9A);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:28px;box-shadow:0 10px 26px rgba(11,60,140,.28);padding:24px}
button.viewfinder .vfi{font-size:52px;width:96px;height:96px;border-radius:30px;background:rgba(255,255,255,.18);display:grid;place-items:center}
button.viewfinder b{font-size:20px}
button.viewfinder small{font-size:13px;opacity:.85}
button.viewfinder .frame{border-color:rgba(255,255,255,.55)}
button.viewfinder:active{transform:scale(.99)}
#scan .modes .chip{flex:1;padding:12px 8px;font-size:14px;text-align:center}
</style>
</head>
<body>
<main id="app">

<section class="screen active" id="home">
  <header class="hero">
    <div class="brand"><span class="logo">D</span><div><h1>DocuSmart</h1><p data-i18n="tagline"></p></div></div>
    <button class="scan-cta" data-go="scan"><span class="ico">📷</span><span><b data-i18n="scanDoc"></b><small data-i18n="scanHint"></small></span></button>
  </header>
  <div class="stats">
    <div><b id="stDocs">0</b><span data-i18n="statDocs"></span></div>
    <div><b id="stFav">0</b><span data-i18n="statFav"></span></div>
    <div><b id="stPages">0</b><span data-i18n="statPages"></span></div>
  </div>
  <h2 data-i18n="quick"></h2>
  <div class="quick" id="quickGrid"></div>
  <h2 data-i18n="recent"></h2>
  <div id="recentList"></div>
  <h2 data-i18n="storage"></h2>
  <div class="storage"><div class="bar"><i id="stBar"></i></div><p id="stText">—</p></div>
</section>

<section class="screen" id="files">
  <h1 class="title" data-i18n="navFiles"></h1>
  <input class="search" id="search" type="search" data-i18n-ph="search">
  <div class="chips" id="chips"></div>
  <div id="fileList"></div>
</section>

<section class="screen" id="scan">
  <h1 class="title" data-i18n="navScan"></h1>
  <button class="viewfinder" id="vf" aria-label="Scan"><div class="frame"></div><span class="vfi">📷</span><b data-i18n="tapScan"></b><small data-i18n="vfHint"></small></button>
  <h2 data-i18n="modeTitle"></h2>
  <div class="modes" id="modes"></div>
  
</section>

<section class="screen" id="tools">
  <h1 class="title" data-i18n="navTools"></h1>
  <div class="toolgrid" id="toolGrid"></div>
</section>

<section class="screen" id="settings">
  <h1 class="title" data-i18n="navSettings"></h1>
  <h2 data-i18n="appearance"></h2>
  <div class="seg" id="themeSeg"></div>
  <h2 data-i18n="language"></h2>
  <div class="seg" id="langSeg"></div>
  <h2 data-i18n="other"></h2>
  <div class="rows" id="otherRows"></div>
  <p class="ver">DocuSmart v0.3.9</p>
</section>

</main>

<nav id="nav">
  <button data-go="home"><i>🏠</i><span data-i18n="navHome"></span></button>
  <button data-go="files"><i>🗂️</i><span data-i18n="navFiles"></span></button>
  <button class="fab" data-go="scan" aria-label="Scan"><i>📷</i></button>
  <button data-go="tools"><i>🧰</i><span data-i18n="navTools"></span></button>
  <button data-go="settings"><i>⚙️</i><span data-i18n="navSettings"></span></button>
</nav>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ---------- i18n module ---------- */
const STR = {
 en:{tagline:'Your Documents, Smarter.',scanDoc:'Scan document',scanHint:'Opens the camera',statDocs:'Documents',statFav:'Favorites',statPages:'Pages',
  quick:'Quick actions',recent:'Recent documents',storage:'Storage',navHome:'Home',navFiles:'Files',navScan:'Scan',navTools:'Tools',navSettings:'Settings',
  search:'Search documents',camPhase:'Pick a mode, then start scanning.',startScan:'Start scanning',appearance:'Appearance',language:'Language',other:'More',
  light:'Light',dark:'Dark',system:'System',emptyRecent:'No documents yet. Scan your first one to see it here.',emptyFiles:'No documents match. Scanned files will appear here.',
  later:'is built in Phase',all:'All',fav:'Favorites',pdf:'PDF',img:'Images',used:'used by DocuSmart',storageNA:'Storage details are not available on this device.',

  tPdf:'Image to PDF',tMerge:'Merge PDF',tSplit:'Split PDF',tComp:'Compress PDF',tOcr:'Smart OCR',tAi:'AI assistant',tQr:'QR scanner',tBar:'Barcode scanner',
  tId:'ID card scanner',tPass:'Passport scanner',tBiz:'Business card',tRec:'Receipt scanner',tSign:'Signature maker',tRes:'Image resizer',tConv:'Document converter',tP2I:'PDF to image',
  mDoc:'Document',mId:'ID card',mBook:'Book',mRec:'Receipt',soon:'Coming in Phase',tapScan:'Tap to scan',vfHint:'The camera opens and edges are detected automatically',modeTitle:'Scan type'},
 bn:{tagline:'আপনার ডকুমেন্ট, আরও স্মার্ট।',scanDoc:'ডকুমেন্ট স্ক্যান করুন',scanHint:'ক্যামেরা খুলবে',statDocs:'ডকুমেন্ট',statFav:'ফেভারিট',statPages:'পৃষ্ঠা',

  light:'লাইট',dark:'ডার্ক',system:'সিস্টেম',emptyRecent:'এখনো কোনো ডকুমেন্ট নেই। প্রথম ডকুমেন্ট স্ক্যান করলে এখানে দেখা যাবে।',emptyFiles:'কিছু পাওয়া যায়নি। স্ক্যান করা ফাইল এখানে আসবে।',
  later:'তৈরি হবে Phase',all:'সব',fav:'ফেভারিট',pdf:'PDF',img:'ছবি',used:'DocuSmart ব্যবহার করছে',storageNA:'এই ডিভাইসে স্টোরেজের তথ্য পাওয়া যায়নি।',

  tId:'আইডি কার্ড স্ক্যানার',tPass:'পাসপোর্ট স্ক্যানার',tBiz:'বিজনেস কার্ড',tRec:'রশিদ স্ক্যানার',tSign:'সিগনেচার মেকার',tRes:'ছবির সাইজ বদল',tConv:'ডকুমেন্ট কনভার্টার',tP2I:'PDF থেকে ছবি',
  mDoc:'ডকুমেন্ট',mId:'আইডি কার্ড',mBook:'বই',mRec:'রশিদ',soon:'আসছে Phase',tapScan:'স্ক্যান করতে ট্যাপ করুন',vfHint:'ক্যামেরা খুলবে, কিনারা নিজে শনাক্ত হবে',modeTitle:'স্ক্যানের ধরন'}
};
/* tool key, icon, phase it is built in */
const TOOLS=[['tPdf','🖼️',3],['tMerge','🔗',3],['tSplit','✂️',3],['tComp','🗜️',3],['tOcr','🔠',4],['tAi','✨',4],['tQr','▦',2],['tBar','𝄃',2],
 ['tId','🪪',2],['tPass','🛂',2],['tBiz','💼',2],['tRec','🧾',2],['tSign','✍️',3],['tRes','📐',3],['tConv','🔄',4],['tP2I','📄',3]];
const QUICK=[['tPdf','🖼️',3],['tOcr','🔠',4],['tAi','✨',4],['tSign','✍️',3]];
const MODES=['mDoc','mId','mBook','mRec'];

const I18n={
 lang:localStorage.getItem('ds_lang')||((navigator.language||'en').startsWith('bn')?'bn':'en'),
 t(k){return (STR[this.lang]||STR.en)[k]||k},
 set(l){this.lang=l;localStorage.setItem('ds_lang',l);document.documentElement.lang=l;this.apply();UI.renderAll()},
 apply(){
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=this.t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=this.t(e.dataset.i18nPh));
 }
};

/* ---------- theme module ---------- */
const Theme={
 mode:localStorage.getItem('ds_theme')||'system',

const Img={
 /* finds the largest bright region, returns [TL,TR,BR,BL] in 0..1 or null */
 detect(video,sc){
  const w=160,h=Math.round(160*(video.videoHeight||video.height)/(video.videoWidth||video.width)),n=w*h;sc.width=w;sc.height=h;
  const c=sc.getContext('2d',{willReadFrequently:true});c.drawImage(video,0,0,w,h);
  const d=c.getImageData(0,0,w,h).data,g=new Uint8Array(n),hist=new Array(256).fill(0);
  for(let i=0;i<n;i++){const v=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;g[i]=v;hist[v]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sb=0,wb=0,best=0,t=128;
  for(let i=0;i<256;i++){wb+=hist[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*hist[i];
   const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>best){best=v;t=i}}
  const m=new Uint8Array(n);for(let i=0;i<n;i++)m[i]=g[i]>t?1:0;
  const seen=new Uint8Array(n);let top=null;
  for(let s=0;s<n;s++){
   if(!m[s]||seen[s])continue;
   const st=[s],px=[];seen[s]=1;
   while(st.length){const p=st.pop();px.push(p);const x=p%w,y=(p/w)|0;
    for(const q of [x>0?p-1:-1,x<w-1?p+1:-1,y>0?p-w:-1,y<h-1?p+w:-1]){if(q>=0&&m[q]&&!seen[q]){seen[q]=1;st.push(q)}}}
   if(!top||px.length>top.length)top=px;
  }
  if(!top||top.length<n*.15||top.length>n*.95)return null;
  let a=[0,1e9],b=[0,-1e9],c2=[0,-1e9],e=[0,1e9];
  for(const p of top){const x=p%w,y=(p/w)|0,s=x+y,df=x-y;
   if(s<a[1]){a=[[x,y],s]}if(df>b[1]){b=[[x,y],df]}if(s>c2[1]){c2=[[x,y],s]}if(df<e[1]){e=[[x,y],df]}}
  return [a[0],b[0],c2[0],e[0]].map(p=>[p[0]/w,p[1]/h]);
 },
 solve(A,b){
  const n=8;for(let i=0;i<n;i++)A[i].push(b[i]);
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];
   for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let k=i;k<=n;k++)A[r][k]-=f*A[i][k]}}
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=A[i][n];for(let k=i+1;k<n;k++)s-=A[i][k]*x[k];x[i]=s/A[i][i]}

 /* perspective correction: maps the quad (pixel coords) onto a flat rectangle */

  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.max(dist(q[0],q[1]),dist(q[3],q[2])),H=Math.max(dist(q[0],q[3]),dist(q[1],q[2]));
  const k=Math.min(1,maxSide/Math.max(W,H));W=Math.max(16,Math.round(W*k));H=Math.max(16,Math.round(H*k));
  const dst=[[0,0],[W,0],[W,H],[0,H]],A=[],b=[];
  for(let i=0;i<4;i++){const [x,y]=dst[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}

  const out=document.createElement('canvas');out.width=W;out.height=H;
  const oc=out.getContext('2d'),od=oc.createImageData(W,H),o=od.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   const den=h[6]*x+h[7]*y+1,u=(h[0]*x+h[1]*y+h[2])/den,v=(h[3]*x+h[4]*y+h[5])/den;
   const x0=Math.max(0,Math.min(sw-2,Math.floor(u))),y0=Math.max(0,Math.min(sh-2,Math.floor(v)));
   const fx=Math.max(0,Math.min(1,u-x0)),fy=Math.max(0,Math.min(1,v-y0)),i00=(y0*sw+x0)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4,oi=(y*W+x)*4;
   for(let c=0;c<3;c++)o[oi+c]=(sd[i00+c]*(1-fx)+sd[i10+c]*fx)*(1-fy)+(sd[i01+c]*(1-fx)+sd[i11+c]*fx)*fy;

  const W=base.width,H=base.height,out=document.createElement('canvas');out.width=W;out.height=H;
  const oc=out.getContext('2d');oc.drawImage(base,0,0);const id=oc.getImageData(0,0,W,H),d=id.data,n=W*H;

  if(mode==='gray'){for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=lum(i)}}
  else if(mode==='hc'){for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)d[i+c]=Math.max(0,Math.min(255,(d[i+c]-128)*1.6+128))}

   const hl=new Array(256).fill(0),hh=new Array(256).fill(0);for(let i=0;i<d.length;i+=4){hl[Math.min(d[i],d[i+1],d[i+2])]++;hh[Math.max(d[i],d[i+1],d[i+2])]++}
   let lo=0,hi=255,a=0;while(lo<255&&(a+=hl[lo])<n*.005)lo++;a=0;while(hi>0&&(a+=hh[hi])<n*.005)hi--;
   const s=255/Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)d[i+c]=Math.max(0,Math.min(255,(d[i+c]-lo)*s));

  else if(mode==='sharp'){
   const src=new Uint8ClampedArray(d),W4=W*4;
   for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=(y*W+x)*4;
    for(let c=0;c<3;c++){const k=i+c,bl=(src[k-4]+src[k+4]+src[k-W4]+src[k+W4]+src[k]*4)/8;d[k]=src[k]+1.1*(src[k]-bl)}}

   const g=new Uint8Array(n),I=new Float64Array((W+1)*(H+1));
   for(let y=0;y<H;y++){let row=0;for(let x=0;x<W;x++){const v=lum((y*W+x)*4);g[y*W+x]=v;row+=v;I[(y+1)*(W+1)+x+1]=I[y*(W+1)+x+1]+row}}
   const r=Math.max(8,Math.round(W/40));
   for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1),y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);
    const s=I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0],mean=s/((x1-x0)*(y1-y0)),i=(y*W+x)*4;
    d[i]=d[i+1]=d[i+2]=g[y*W+x]<mean*.9?0:255;
   }
  }
  oc.putImageData(id,0,0);return out;
 }
};

const Camera={
 pages:[],quad:null,prev:null,stable:0,cool:0,auto:true,torch:false,fi:'enh',

  if(this.el)return;
  const d=document.createElement('div');d.id='cam';d.hidden=true;
  d.innerHTML=`<div class="cv" data-v="live"><video playsinline muted autoplay></video><canvas class="ov"></canvas><div class="hint" id="cHint"></div>
   <div class="cbar"><button id="cClose">✕</button><button id="cFlash">🔦</button><button id="cAuto"></button><button id="cShot" class="shot" aria-label="Capture"></button><button id="cDone" class="txt"></button></div></div>
  <div class="cv" data-v="crop" hidden><div class="hint" id="cropHint"></div><div class="stage"><canvas id="cropCv"></canvas></div>
   <div class="cbar"><button id="cRetake" class="txt"></button><button id="cApply" class="txt pri"></button></div></div>
  <div class="cv" data-v="filter" hidden><div class="hint" id="fHint"></div><div class="stage"><canvas id="fCv"></canvas></div><div class="fchips" id="fChips"></div>
   <div class="cbar"><button id="fAdd" class="txt"></button><button id="fSave" class="txt pri"></button></div></div>`;
  document.body.append(d);this.el=d;this.video=d.querySelector('video');this.ov=d.querySelector('.ov');this.sc=document.createElement('canvas');
  const $=id=>d.querySelector('#'+id);this.$=$;
  $('cClose').onclick=()=>this.close();$('cShot').onclick=()=>this.capture();
  $('cAuto').onclick=()=>{this.auto=!this.auto;this.label()};$('cFlash').onclick=()=>this.flash();$('cDone').onclick=()=>this.finish(false);
  $('cRetake').onclick=()=>this.show('live');$('cApply').onclick=()=>this.applyCrop();
  $('fAdd').onclick=async()=>{await this.addPage();this.show('live')};$('fSave').onclick=()=>this.finish(true);
  const cv=$('cropCv');let drag=-1;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/this.cs,(e.clientY-r.top)/this.cs]};
  cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);let b=1e9;this.cq.forEach((p,i)=>{const dd=Math.hypot(p[0]-x,p[1]-y)*this.cs;if(dd<b){b=dd;drag=i}});if(b>60)drag=-1;else cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(drag<0)return;const [x,y]=pos(e);this.cq[drag]=[Math.max(0,Math.min(this.cap.width,x)),Math.max(0,Math.min(this.cap.height,y))];this.drawCrop()});

  this.$('cDone').textContent=this.pages.length?`${ct('done')} (${this.pages.length})`:'';
  this.$('cDone').style.visibility=this.pages.length?'visible':'hidden';
  this.$('cRetake').textContent=ct('retake');this.$('cApply').textContent=ct('apply');

   this.video.srcObject=this.stream;await this.video.play();

/* minimal PDF 1.4 writer: one JPEG image per page */
const Pdf={
 build(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,s)=>{offs[n]=len;push(`${n} 0 obj\n${s}\nendobj\n`)};
  const N=pages.length;push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${N} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>`);
  pages.forEach((p,i)=>{
   const a=3+3*i,cs=`q ${p.pw} 0 0 ${p.ph} 0 0 cm /Im0 Do Q`;
   obj(a,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pw} ${p.ph}] /Resources << /XObject << /Im0 ${a+2} 0 R >> >> /Contents ${a+1} 0 R >>`);
   obj(a+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
   offs[a+2]=len;push(`${a+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);
   push(p.bytes);push('\nendstream\nendobj\n');
  });
  const total=3+3*N,xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
 }
};

 async share(d){
  const bl=await this.blobs(d);if(!bl.length){UI.toast(ft('gone'));return}
  const pdf=d.type==='pdf',ext=pdf?'pdf':'jpg',mt=pdf?'application/pdf':'image/jpeg',nm=d.name.replace(/[\\/:*?"<>|]/g,'-');
  const files=bl.map((b,i)=>new File([b],bl.length>1?`${nm}-${i+1}.${ext}`:`${nm}.${ext}`,{type:mt}));
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove()})},
 sheet(d){
  const s=document.createElement('div');s.id='sheet';const box=document.createElement('div');box.className='sb';s.append(box);
  const t=document.createElement('p');t.className='lbl';t.textContent=d.name;box.append(t);
  [['open',()=>this.open(d)],['share',()=>this.share(d)],['rename',()=>this.rename(d)],[d.fav?'unfav':'fav',()=>this.fav(d)],['del',()=>this.remove(d)]].forEach(([k,fn])=>{
   const b=document.createElement('button');b.textContent=ft(k);if(k==='del')b.className='dg';b.onclick=()=>{s.remove();fn()};box.append(b)});
  s.onclick=e=>{if(e.target===s)s.remove()};document.body.append(s)},
 view(){
  if(this.vw)return this.vw;
  const v=document.createElement('div');v.id='vw';v.hidden=true;
  v.innerHTML='<div class="psh"><button id="vwX" aria-label="Close">✕</button><b class="vt" id="vwT"></b><button id="vwS" aria-label="Share">⤴</button></div><div class="psb" id="vwB"></div>';
  document.body.append(v);v.querySelector('#vwX').onclick=()=>this.closeView();this.vw=v;return v},
 async open(d){
  const v=this.view(),body=v.querySelector('#vwB');
  this.vurls.forEach(u=>URL.revokeObjectURL(u));this.vurls=[];
  v.hidden=false;v.querySelector('#vwT').textContent=d.name;body.innerHTML='';v.querySelector('#vwS').onclick=()=>this.share(d);
  const bl=await this.blobs(d);
  if(!bl.length){const e=document.createElement('div');e.className='empty';e.style.marginTop='16px';e.textContent=ft('gone');body.append(e);return}
  this.vurls=bl.map(b=>URL.createObjectURL(b));
  if(d.type==='pdf'){
   const c=document.createElement('div');c.className='empty';c.style.marginTop='16px';c.textContent=ft('pdfInfo');
   const b=document.createElement('button');b.className='primary';b.style.marginTop='14px';b.textContent=ft('openPdf');
   b.onclick=()=>window.open(this.vurls[0],'_blank');c.append(document.createElement('br'),b);body.append(c);
  }else this.vurls.forEach((u,i)=>{const im=new Image();im.src=u;im.alt=ft('page')+' '+(i+1);im.className='vp';body.append(im)});
 },
 closeView(){this.vw.hidden=true;this.vurls.forEach(u=>URL.revokeObjectURL(u));this.vurls=[]}
};

UI.docItem=function(d){
 const el=document.createElement('div');el.className='item';
 el.innerHTML='<div class="th">📄</div><div class="mt"><b></b><small></small></div><button class="ib fv" aria-label="Favorite"></button><button class="ib mo" aria-label="Menu">⋮</button>';
 el.querySelector('b').textContent=d.name;
 el.querySelector('small').textContent=`${d.pages||1} ${ps('pg')} • ${new Date(d.date).toLocaleDateString(I18n.lang==='bn'?'bn-BD':'en-GB')}`;
 const fv=el.querySelector('.fv');fv.textContent=d.fav?'★':'☆';fv.style.color=d.fav?'#F5A524':'var(--mute)';
 Files.thumb(d,el.querySelector('.th'));
 fv.onclick=e=>{e.stopPropagation();Files.fav(d)};
 el.querySelector('.mo').onclick=e=>{e.stopPropagation();Files.sheet(d)};
 el.onclick=()=>Files.open(d);return el};

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
UI.renderAll();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
